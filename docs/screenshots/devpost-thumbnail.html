<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&display=swap" rel="stylesheet">
<style>
:root{--plate:#081a52;--ink:#eef3fc;--growth:#e8341f;--broth:#a9c6e8;--rim:#dce6f5}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:800px}
body{background:var(--plate);font-family:"Archivo",system-ui,sans-serif;color:var(--ink);
     overflow:hidden;display:flex;align-items:center;gap:40px;padding:0 64px}

.say{flex:0 0 560px}
h1{font-size:104px;line-height:.87;font-weight:600;font-stretch:112%;letter-spacing:-.032em}
.lines{margin-top:36px;font-size:27px;line-height:1.5;color:var(--broth)}
.lines b{color:var(--ink);font-weight:600}
.lines em{color:var(--growth);font-weight:700;font-style:normal}
.lines span{display:block}

.art{flex:1;display:flex;align-items:center;justify-content:center}
.art svg{width:100%;height:430px;overflow:visible}
.art svg path{stroke:var(--rim)!important;stroke-width:3.6px}
.art svg text{fill:var(--broth)!important;font-family:"Archivo",sans-serif!important;font-weight:600!important}

/* ground: the plate itself, at the design system's own well geometry
   (--well 52px, --well-gap 10px), fading in from the left so the
   headline never sits on texture. */
body{position:relative}
body::before{content:"";position:absolute;inset:-62px;z-index:0;
  background-image:radial-gradient(circle at center,
    transparent 44%,
    rgba(220,230,245,.085) 44.5%, rgba(220,230,245,.085) 46.5%,
    transparent 47%);
  background-size:62px 62px;
  -webkit-mask-image:linear-gradient(97deg, transparent 26%, rgba(0,0,0,.55) 46%, #000 72%);
  mask-image:linear-gradient(97deg, transparent 26%, rgba(0,0,0,.55) 46%, #000 72%)}
body::after{content:"";position:absolute;inset:0;z-index:0;
  background:radial-gradient(58% 68% at 76% 46%, rgba(16,52,166,.5), transparent 68%)}
.say,.art{position:relative;z-index:1}
</style></head><body>
<div class="say">
  <h1>Plant<br>Shortlist</h1>
  <p class="lines">
    <span><b>97,709</b> plant compounds never measured.</span>
    <span>Ranked against three bacteria.</span>
    <span><em>150</em> for the lab, each with its distance.</span>
  </p>
</div>
